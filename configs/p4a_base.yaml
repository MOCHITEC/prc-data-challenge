# P4 stage A, arm: base  --  baseline: no candidate column
#
# The -3.2424 recorded for stand_arrival_gap was measured against an EIGHT-month baseline. Production's
# forward fold trains on ten, and the ten-month baseline is already 2.6888 s better on the same 328,009 rows
# (8bdf4f9:docs/codex_fe_results/continuation_evaluation.json, arm baseline_10m_vs_baseline). What the gap
# buys ON TOP of the baseline we actually ship has never been measured: continuation_state.json records
# "current": "gap_10m" - the run stopped there.
#
# All three arms are configs/main_reparam.yaml + folds:[forward] + one include_candidates line, so the only
# difference between base and gap is the column. The noise arm is there because adding ANY column changes the
# model: features_log.md measures a signal-free column at +/-0.5 s, twice the instrument's resolution, and
# experiments 1-3 produced a false "all three harmful" verdict for want of it.
name: p4a_base
num_rounds: 2000
early_stopping: 100
use_categoricals: true
use_encodings: true
use_weather: true
reference_min_count: 30
inner_holdout_months: 1
unmatched_num_leaves: 127
unmatched_min_data_in_leaf: 50
unmatched_num_rounds: 2000
n_seeds: 3
unmatched_sched_reparam: true
unmatched_sched_reparam_airports: [LIRF]
lobt_bound: true
folds: [forward]

