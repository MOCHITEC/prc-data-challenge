# jul_fwd replication of configs/c13_noise2.yaml (C1-two-column-remeasured.md §9). Byte-identical to it below
# this header except `name` and `folds`.
#
# Arity control, two columns
#
# Arm 7 of the C1/C3 measurement (docs/competitor_research_2026-09-21/results/C1-C3-measured.md).
# Everything below the arm block is configs/main_gap.yaml verbatim except `folds`, which is the repository's
# screening condition (docs/features_log.md: `folds: [forward]` + `--skip-predict`, weather on, 3 seeds).
# All six arms are cut from ONE feature frame in data/work_c1c3, built with wind_dir and gust_repair on, so
# the arms differ by which columns the model is shown and by nothing else - not by a rebuild, not by a seed,
# not by a row.
#
# two columns that cannot carry signal, the arity match for the two-column C1 (c13_c1_2col). Adding ANY column to
# this model is worth +/-0.5 s on its own (docs/features_log.md), so a two-column candidate is read against two
# noise columns, never against the base alone and never against the three-column control.
name: c13_noise2_jf
num_rounds: 2000
early_stopping: 100
use_categoricals: true
use_encodings: true
use_weather: true
wind_dir: true
gust_repair: true
reference_min_count: 30
inner_holdout_months: 1
unmatched_num_leaves: 127
unmatched_min_data_in_leaf: 50
unmatched_num_rounds: 2000
n_seeds: 3
unmatched_sched_reparam: true
unmatched_sched_reparam_airports: [LIRF]
lobt_bound: true
es_holdout_encodings: true
folds: [jul_fwd]
include_candidates: [stand_arrival_gap, noise_control, noise_control_2]
exclude_features: [wind_dir_deg, headwind_kt, crosswind_kt, rwy_wind_misalign, gust_filled, gust_excess, gust_filled_prev1h, gust_excess_prev1h]
