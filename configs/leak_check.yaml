# Does training on months that come after the validation month actually inflate the score? jul is validated
# twice - once on all eleven other months (the leaky way this repo has always done it) and once on January to
# June only. Same month, same rows, so the difference is the leak and nothing else.
name: leak_check
num_rounds: 2000
early_stopping: 100
use_categoricals: true
use_encodings: true
use_weather: false
reference_min_count: 30
inner_holdout_months: 1
unmatched_num_leaves: 127
unmatched_min_data_in_leaf: 50
unmatched_num_rounds: 2000
n_seeds: 1
folds: [jul, jul_fwd]
