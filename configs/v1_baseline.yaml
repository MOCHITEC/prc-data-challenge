# v1: the cheapest honest baseline. Purpose is to exercise the submission path and measure the scoring delay,
# not to score well.
#
# NOTE (measured 2026-09-10): this is NOT a different model from v2. The two-clock reparameterisation and the
# separate model for rows without an NM record live in prc.predict_fold and apply to every config. Every field
# below except num_rounds and early_stopping is already the TrainConfig default, so v1 vs v2 measures the
# effect of boosting rounds alone: 200 rounds against 2000, worth -4.69 s CV RMSE (95% CI -8.24..-1.26).
name: v1_baseline
scheme: fast
num_rounds: 200
early_stopping: 30
use_categoricals: true
use_weather: false
note: "two-clock at 200 rounds; exercises the gate and measures scoring latency"
