# v2: the two-clock model (docs/04 section 4-1). Target for matched rows is TAXITIME - (MVT_TIME - AOBT_3);
# rows without an NM record get their own schedule-based model.
name: v2_two_clock
scheme: fast
num_rounds: 2000
early_stopping: 100
use_categoricals: true
use_weather: false
reference_min_count: 30
inner_holdout_months: 1
note: "two-clock residual over the NM off-block time, separate model for rows without an NM record"
