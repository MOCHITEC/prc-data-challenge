# C1 - proxy_is_nominal
#
# Arm 2 of the C1/C3 measurement (docs/competitor_research_2026-09-21/results/C1-C3-measured.md).
# Everything below the arm block is configs/main_gap.yaml verbatim except `folds`, which is the repository's
# screening condition (docs/features_log.md: `folds: [forward]` + `--skip-predict`, weather on, 3 seeds).
# All six arms are cut from ONE feature frame in data/work_c1c3, built with wind_dir and gust_repair on, so
# the arms differ by which columns the model is shown and by nothing else - not by a rebuild, not by a seed,
# not by a row.
#
# C1's three columns. Pre-registered at -0.05 to -0.15 s of board, point -0.07.
name: c13_c1
num_rounds: 2000
early_stopping: 100
use_categoricals: true
use_encodings: true
use_weather: true
wind_dir: true
gust_repair: true
reference_min_count: 30
inner_holdout_months: 1
unmatched_num_leaves: 127
unmatched_min_data_in_leaf: 50
unmatched_num_rounds: 2000
n_seeds: 3
unmatched_sched_reparam: true
unmatched_sched_reparam_airports: [LIRF]
lobt_bound: true
es_holdout_encodings: true
folds: [forward]
include_candidates: [stand_arrival_gap, proxy_at_mode, proxy_minus_mode_min, proxy_sec_in_min]
exclude_features: [wind_dir_deg, headwind_kt, crosswind_kt, rwy_wind_misalign, gust_filled, gust_excess, gust_filled_prev1h, gust_excess_prev1h]
