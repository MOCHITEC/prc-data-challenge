# v8: the clock-source mixture with the classifier's probabilities calibrated against the routed squared error.
#
# docs/06 8-0-4: a posterior mean is only optimal when the probabilities are calibrated, and the cost of
# miscalibration scales with the candidate value being multiplied. v6 demonstrated the failure - source rates
# raised P(sched) at LIRF, where mvt_minus_sched runs 50,000-130,000s, and that one class went 390 -> 752.
#
# The temperature is fitted on the inner holdout using the *early-stopping* classifier, which is the only model
# here that is genuinely out of sample on those rows, and it is optimised against squared error rather than
# log-loss because squared error is the competition metric. The taxi head's predictions on those same rows are
# in-sample and therefore optimistic, which biases the fit toward less routing - the safe direction, given the
# failure mode being corrected is over-routing.
name: v8_mixture_calibrated
model: clock_mixture
scheme: fast
num_rounds: 2000
early_stopping: 100
clf_num_rounds: 400
match_tol_s: 60
use_categoricals: true
use_weather: false
reference_min_count: 30
inner_holdout_months: 1
use_source_rates: false
calibrate_temperature: true
note: "clock-source mixture with temperature calibration fitted on the inner holdout against the routed squared error"
