# main_flseq_osm_nolirf with model A fitted on the plain label (`matched_target: plain`): target TAXITIME_SEC_mvt
# itself instead of g = TAXITIME_SEC_mvt - mvt_minus_aobt3, with mvt_minus_aobt3 still a feature and nothing added
# back. The only difference from configs/main_flseq_osm_nolirf.yaml is that key (and the name).
# It is the "plain-y" member of a fixed 50/50 blend with main_flseq_osm_nolirf's anchored model A on the matched
# lane; the blend is built from the two runs' outputs by scripts/plainy_blend.py, not by this recipe.
# Pre-registration and results: docs/competitor_research_2026-09-21/results/plainy-blend.md.
# External data: OpenStreetMap (ODbL 1.0) and OurAirports runways (public domain); docs/external_data.md.
name: main_flseq_osm_nolirf_plainy
num_rounds: 2000
early_stopping: 100
use_categoricals: true
use_encodings: true
use_weather: true
reference_min_count: 30
inner_holdout_months: 1
unmatched_num_leaves: 127
unmatched_min_data_in_leaf: 50
unmatched_num_rounds: 2000
n_seeds: 3
unmatched_sched_reparam: true
unmatched_sched_reparam_airports: [LIRF]
lobt_bound: true
include_candidates: [stand_arrival_gap, fl_fmt_code, fl_len, fl_nm_rate_other, dup_n, dup_n_unm_twins, dup_n_m_twins, dup_mvt_span, seq_hw_prev_pairq, seq_hw_excess, seq_lead_wtc, seq_burst_pos, seq_burst_len, seq_burst_elapsed, seq_burst_remaining, seq_burst_pos_frac, seq_hw_mean_prev5, seq_hw_mean_next5, seq_hw_min_prev3, seq_arr_since_prevdep, seq_arr_prev_s, seq_arr_next_s, seq_arr_pm10m, seq_rwy_share_pm30]
fe_osm_dist: true
fe_osm_null_airports: [LIRF]
matched_target: plain
