# v9: model A（NM マッチ行、全体の 98.8%）の容量を初めて広げる。
#
# 根拠: model B は容量不足だった（v5 棄却 → v6 で −34.8 秒）。一方 model A は v1 から 127 葉のまま一度も
# 触っていないのに、マッチ行 RMSE は 218.6 から動いていない（誤差の 41.4%）。同じ「容量不足」が model A
# 側にもあるかを、v8 との 1 変数比較で測る（葉数だけ違い、シード 3 本は揃える）。
name: v9_matched_wider
scheme: fast
num_rounds: 2000
early_stopping: 100
use_categoricals: true
use_weather: false
reference_min_count: 30
inner_holdout_months: 1
params:
  num_leaves: 255
unmatched_num_leaves: 255
unmatched_min_data_in_leaf: 20
unmatched_num_rounds: 3000
n_seeds: 3
note: "v8 + model A 255葉"
