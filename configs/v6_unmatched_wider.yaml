# v6: v5 の逆方向。model B の容量を増やす。
#
# 根拠: v5（31葉/600本）は未マッチ行を +92.6 秒悪化させた。過学習ではなく容量不足の側にいる。
# 診断 B では model B が分散の 62.4% を説明しており、p99 まで実測と一致している。
# 残る誤差は最極端の数百行。より細かい葉があれば分離できる可能性がある。
name: v6_unmatched_wider
scheme: fast
num_rounds: 2000
early_stopping: 100
use_categoricals: true
use_weather: false
reference_min_count: 30
inner_holdout_months: 1
unmatched_num_leaves: 255
unmatched_min_data_in_leaf: 20
unmatched_num_rounds: 3000
note: "v2 と同一。model B の容量のみ 127葉/2000本 -> 255葉/3000本"
