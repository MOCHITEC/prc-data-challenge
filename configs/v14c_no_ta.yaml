# v5: mixture over clock sources (docs/06 section 8, P1).
#
# Two heads. A multiclass classifier estimates which clock wrote BLOCK_TIME; a taxi-time regressor (the v2
# two-clock model) is fitted only on the rows whose BLOCK_TIME really is an off-block time. The prediction is
# the L2-optimal posterior mean over the two, so a row the classifier believes was schedule-reported is
# predicted as MVT_TIME - SCHED_TIME rather than as a normal taxi time.
#
# Measured on the jan fold against v2: 375.71 -> 357.15, paired bootstrap -18.56s CI95 [-48.27, -1.32],
# P(better) = 0.996. Soft mixing beats hard argmax routing by a further 5.77s at P = 1.000.
name: v14c_no_ta
model: clock_mixture
scheme: janjul
num_rounds: 2000
early_stopping: 100
clf_num_rounds: 400
match_tol_s: 60
use_categoricals: true
use_weather: true
reference_min_count: 30
inner_holdout_months: 1
note: "v14b ablation: without ta"
use_source_rates: false
# docs/06 8-0-6: `genuine` is 58.3% of v7's remaining squared error at RMSE 284.0 and had no work done on it,
# while perfect routing is now worth only -25.7s and three attempts say most of that is unreachable. Weather is
# the operationally motivated lever: de-icing at or below 3 C with precipitation is reported to move taxi-out by
# 400-1000s, and low visibility triggers low-visibility procedures that lengthen every departure.
# v14: v12 plus every group from docs/analysis/README.md (stand occupancy, turnaround fingerprint, flight-number
# fingerprint and duplicates, runway sequence, schedule backlog). Ablations drop one prefix at a time.
drop_feature_prefixes: ["ta_"]
