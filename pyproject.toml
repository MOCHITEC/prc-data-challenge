[project]
name = "prc-dc2026-taxiout"
version = "0.1.0"
description = "PRC Data Challenge 2026 - taxi-out time prediction with Snowflake as the feature platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "polars>=1.30",
  "pyarrow>=17",
  "duckdb>=1.1",
  "lightgbm>=4.5",
  "catboost>=1.2.7",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "minio>=7.2",
  "requests>=2.32",
  "snowflake-connector-python[pandas]>=3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "ipykernel", "matplotlib", "seaborn"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["DTZ"]  # timestamps are naive UTC by contract (docs/02 §5)

[tool.pytest.ini_options]
testpaths = ["tests"]
